# Prometheus alert rules. docs/DEVOPS/07 § Key Alerts.
#
# Scraped from the API's GET /metrics with `Authorization: Bearer $METRICS_TOKEN` (P3-05). Each rule
# names a metric the API registers in backend/api/src/shared/metrics/metrics.ts; a spec checks that
# every metric referenced here exists, so a renamed counter cannot silently leave an alert watching
# nothing.

groups:
  - name: tls
    rules:
      # docs/DEVOPS/07: TLS certificate expiry alert. Fires when a certificate for any of
      # the three fixed hostnames expires in less than 14 days. Caddy renews automatically,
      # but a renewal failure (DNS problem, ACME rate-limit, expired account email) must
      # be caught well before the certificate expires.
      #
      # Requires the Prometheus blackbox exporter scraping each hostname, configured with:
      #   targets:
      #     - https://app.vizunicum.my.id
      #     - https://invitation.vizunicum.my.id
      #     - https://admin.vizunicum.my.id
      #
      # P3-11: three fixed certificates, automatic ACME renewal (ADR-024).
      - alert: CertificateExpiresInFourteenDays
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
        for: 1h
        labels:
          severity: high
          channel: ops
        annotations:
          summary: "TLS certificate for {{ $labels.instance }} expires in less than 14 days"
          runbook: "Check Caddy ACME logs (`docker compose logs caddy | grep acme`); verify DNS resolves for {{ $labels.instance }}; check Let's Encrypt account email is reachable"

  - name: payments
    rules:
      # docs/DEVOPS/07: "Payment webhook signature invalid above a threshold within a short period —
      # High (indicates a possible fraud attempt) — Slack security channel". Five in ten minutes: a
      # misconfigured or rotated key produces a burst; one stray probe does not page anyone.
      - alert: PaymentWebhookInvalidSignatures
        expr: sum by (provider) (increase(wi_payment_webhook_signature_invalid_total[10m])) > 5
        labels:
          severity: high
          channel: security
        annotations:
          summary: "More than 5 payment notifications failed signature verification in 10 minutes ({{ $labels.provider }})"
          runbook: "docs/SECURITY/12-INCIDENT-RESPONSE.md (payment fraud); payment_notifications WHERE NOT signature_valid"

      # Every verified notification a human must look at: a late payment, a second charge, an amount
      # mismatch, an unknown payment, a refund notification. Any one is actionable.
      - alert: PaymentNeedsReview
        expr: sum by (provider, result) (increase(wi_payment_needs_review_total[15m])) > 0
        labels:
          severity: high
          channel: payments
        annotations:
          summary: "A payment notification needs manual review ({{ $labels.result }})"
          runbook: "payment_notifications WHERE needs_review ORDER BY received_at DESC"

  - name: cache
    rules:
      # docs/DEVOPS/07: "Public Invitation cache hit ratio drops drastically (< 50%) suddenly —
      # High — Slack + investigate" (P3-12, target > 90% docs/DEVOPS/05).
      - alert: PublicInvitationCacheHitRatioLow
        expr: (rate(wi_public_invitation_cache_hits_total[5m]) / (rate(wi_public_invitation_cache_hits_total[5m]) + rate(wi_public_invitation_cache_misses_total[5m]))) < 0.50 and (rate(wi_public_invitation_cache_hits_total[5m]) + rate(wi_public_invitation_cache_misses_total[5m])) > 1
        for: 5m
        labels:
          severity: high
          channel: ops
        annotations:
          summary: "Public invitation cache hit ratio dropped below 50%"
          runbook: "docs/DEVOPS/05-MONITORING.md (Cache hit ratio target > 90%); investigate excessive cache invalidations or redis eviction"
