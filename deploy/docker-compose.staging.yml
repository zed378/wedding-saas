# The staging stack. `P0-23`.
#
# A variant of docker-compose.yml, not a replacement. The differences are the ones that
# separate a laptop from a shared host:
#
#   docker-compose.yml          Development. Secrets are literals in the file, every
#                               port is published so you can poke at things, NODE_ENV
#                               is development.
#   docker-compose.staging.yml  Deployed. Every secret comes from the environment and
#                               the stack refuses to start without it, only the four
#                               application ports are published, NODE_ENV is production.
#
# ## Running it
#
#   cd /home/infra/wedding
#   cp deploy/staging.env.example .env && $EDITOR .env      # never committed
#   docker compose -f deploy/docker-compose.staging.yml --env-file .env up -d --build
#
# Migrations are a SEPARATE command and never run on startup (ADR-006):
#
#   docker compose -f deploy/docker-compose.staging.yml --env-file .env run --rm migrate
#
# Seed data, likewise deliberate (docs/DEVOPS/00 § Environment List):
#
#   docker compose -f deploy/docker-compose.staging.yml --env-file .env run --rm seed
#
# ## Ports
#
# This host is shared -- it already runs eight other compose projects. Everything here
# sits in 18000-18399, a block nothing else uses. `docker compose ls` before adding to it.
#
# PostgreSQL, Redis and MinIO publish NOTHING. They are reachable on the compose network
# by the services that need them and nowhere else; a published database port is a
# database port someone eventually reaches. Migrations run inside the network, which is
# why there is a `migrate` service rather than an exposed 5432.
#
# ## What is NOT here yet
#
#   - Public hostnames, until CLOUDFLARE_TUNNEL_TOKEN is set and `--profile tunnel` is
#     used. Without it the stack is reachable over the VPN by IP and port, which is
#     enough to verify everything except the hostnames themselves.
#   - ClamAV. `docs/BACKEND/04` runs it only in the media pool, and no upload path exists
#     before `P1-16`. Adding it now would cost ~1.5GB of signatures to scan nothing.

name: wedding-staging

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_OWNER_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
      # Read by deploy/postgres/init/01-app-role.sh when the volume is first created.
      # Must match the password in DATABASE_URL, or the API cannot connect and the
      # symptom is an authentication failure that looks like a typo in the URL.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?required}
    volumes:
      # Mount the PARENT, not /var/lib/postgresql/data. PostgreSQL 18 moved PGDATA to
      # /var/lib/postgresql/18/docker and declares VOLUME on the parent (ADR-029). The
      # old mount point would not error -- it would mount an empty volume and lose the
      # data on the first `down`.
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_OWNER_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:?required}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:?required}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot. The names are the API's defaults (env.schema.ts: STORAGE_BUCKET_USER_MEDIA,
  # STORAGE_BUCKET_TEMPLATE_ASSETS, STORAGE_BUCKET_STAGING) and the ones docs/ARCHITECTURE/05
  # specifies. A bucket the application does not look for is a bucket that is empty
  # forever while uploads fail with NoSuchBucket.
  #
  # All three stay PRIVATE. Public reads go through the CDN with origin access control,
  # never a bucket URL.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/user-media local/template-assets local/staging
        echo "buckets ready (private): user-media, template-assets, staging"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:?required}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:?required}

  # Schema changes, as their own command and their own image.
  #
  # `profiles` keeps it out of `up`: it must be run deliberately, and a migration that
  # happens as a side effect of starting the stack is a migration nobody watched
  # (ADR-006). It is the only service holding MIGRATION_DATABASE_URL -- the owner role
  # that can alter schema and bypass row-level security.
  migrate:
    profiles: [migrate]
    build:
      context: ..
      dockerfile: backend/api/Dockerfile
      target: migrator
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:?required}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?required}
    depends_on:
      postgres: { condition: service_healthy }

  # Seed data, as its own service rather than an argument to `migrate`.
  #
  # `docs/DEVOPS/00` § Environment List requires staging to carry "realistic dummy data,
  # periodically reset ... from curated seed data". This installs the reference template
  # and its demo invitation (`P0-21`).
  #
  # It exists as a service because the obvious alternative is a trap:
  #
  #   docker compose run --rm migrate node src/infra/db/seed.mts     # WRONG
  #
  # The migrator's ENTRYPOINT is already `node`, so that runs `node node src/...` and
  # fails with MODULE_NOT_FOUND pointing at nothing useful. Naming the service removes
  # the chance to get it wrong.
  #
  #   docker compose -f deploy/docker-compose.staging.yml --env-file .env run --rm seed
  #
  # It refuses when APP_ENV=production (ADR-043), which is the guard that matters: the
  # deployment, not the build.
  seed:
    profiles: [seed]
    build:
      context: ..
      dockerfile: backend/api/Dockerfile
      target: migrator
    command: ["src/infra/db/seed.mts"]
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:?required}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?required}
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build:
      context: ..
      dockerfile: backend/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:?required}
      PORT: "3000"
      SERVICE_NAME: api
      APP_ORIGIN: ${APP_ORIGIN:?required}
      PUBLIC_INVITE_ORIGIN: ${PUBLIC_INVITE_ORIGIN:?required}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:?required}
      # The application role. It cannot alter schema; that is the `migrate` service's
      # job and its credentials are not in this container.
      DATABASE_URL: ${DATABASE_URL:?required}
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?required}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?required}
      # Required since `P1-03`, at 32 characters, in EVERY environment (ADR-047). The API
      # validates its environment at startup and exits 78 naming what is missing, so a
      # deploy without these does not half-work -- the container restarts forever.
      #
      # Generated ON THE HOST with `openssl rand -base64 48`, never typed anywhere else.
      # Rotating them is not free: `deploy/SECRETS.md` records that a new JWT_SIGNING_KEY
      # signs every user out, and a new REFRESH_TOKEN_PEPPER ends every session.
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?required}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:?required}
    ports: ["${STAGING_API_PORT:-18000}:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  # docs/SECURITY/06 layer 10, and a dependency of worker-media rather than an optional
  # extra: that worker refuses to start without it (P1-18). `start_period` is long because
  # the first boot downloads the full signature database, and a shorter one would mark a
  # healthy container unhealthy every time the volume is recreated.
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  worker-general:
    build: { context: .., dockerfile: backend/worker/Dockerfile }
    restart: unless-stopped
    command: ["--pool", "general"]
    environment:
      NODE_ENV: production
      SERVICE_NAME: worker-general
      REDIS_URL: redis://redis:6379
      DATABASE_URL: ${DATABASE_URL:?required}
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }

  worker-media:
    build: { context: .., dockerfile: backend/worker/Dockerfile }
    restart: unless-stopped
    command: ["--pool", "media"]
    environment:
      NODE_ENV: production
      SERVICE_NAME: worker-media
      REDIS_URL: redis://redis:6379
      DATABASE_URL: ${DATABASE_URL:?required}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?required}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?required}
      # docs/SECURITY/06 layer 10. The worker REFUSES TO START without this (P1-18), and
      # MEDIA_SCAN_DISABLED is rejected outright when NODE_ENV is production or staging --
      # an unscanned upload that reached `ready` is the outcome the layer exists to prevent.
      CLAMAV_HOST: clamav
    # Hard caps, per docs/BACKEND/04 § Resource Isolation. This pool decodes untrusted
    # images: one crafted file must not starve the other eight projects on this host.
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 1536M }
        reservations: { cpus: "0.25", memory: 256M }
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      clamav: { condition: service_healthy }

  worker-cron:
    build: { context: .., dockerfile: backend/worker/Dockerfile }
    restart: unless-stopped
    command: ["--pool", "cron"]
    environment:
      NODE_ENV: production
      SERVICE_NAME: worker-cron
      REDIS_URL: redis://redis:6379
      DATABASE_URL: ${DATABASE_URL:?required}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?required}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?required}
      # The documented cron times are WIB. The schedules carry an explicit timezone, so
      # this only affects log timestamps -- but a container in UTC read against a WIB
      # schedule is confusing enough to be worth setting.
      TZ: Asia/Jakarta
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }

  web-app:
    build:
      context: ..
      dockerfile: frontend/web-app/Dockerfile
      args:
        # A build argument because `NEXT_PUBLIC_*` is inlined into the browser bundle by
        # `next build`. Putting it under `environment:` would look right and do nothing:
        # the value the browser uses was fixed when the image was built.
        #
        # It must be the address a VISITOR's browser can reach, not a compose service
        # name -- `http://api:3000` resolves only inside this network.
        NEXT_PUBLIC_API_BASE_URL: ${API_PUBLIC_BASE_URL:?required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3100"
    ports: ["${STAGING_WEB_APP_PORT:-18100}:3100"]

  public-invite:
    build: { context: .., dockerfile: frontend/public-invite/Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3200"
    ports: ["${STAGING_PUBLIC_INVITE_PORT:-18200}:3200"]

  admin:
    build: { context: .., dockerfile: admin/Dockerfile }
    restart: unless-stopped
    ports: ["${STAGING_ADMIN_PORT:-18300}:8080"]

  # Cloudflare Tunnel. `P0-23`.
  #
  # The host has a PRIVATE address (10.1.200.13). Cloudflare cannot proxy to it and
  # Let's Encrypt HTTP-01 cannot reach it, so the usual "point an A record at the box"
  # does not apply. `cloudflared` solves it from the other direction: it dials OUT to
  # Cloudflare and traffic arrives down that connection, so the host needs no inbound
  # port open at all and no certificate of its own -- Cloudflare terminates TLS at its
  # edge.
  #
  # No Caddy in front of it, deliberately. Its ACME challenge would fail forever behind
  # a tunnel, producing a service that works while logging certificate errors -- the kind
  # of permanent-warning state that trains people to ignore logs.
  #
  # ## Getting the token
  #
  # Zero Trust -> Networks -> Tunnels -> Create a tunnel -> Docker. Copy the token from
  # the command it shows (the long `ey...` value) into CLOUDFLARE_TUNNEL_TOKEN in .env.
  #
  # It is a RUN token, not an API token: it lets this container join one tunnel and
  # nothing else. It cannot read DNS, create records or touch the account -- which is
  # why it is the right credential to put on a shared host.
  #
  # ## Routing
  #
  # Public hostnames are configured in the Zero Trust dashboard, not here
  # (`config_src: cloudflare`). Adding one there ALSO creates its DNS record
  # automatically, which is why this deployment needs no Zone:DNS:Edit permission:
  #
  #   app.vizunicum.my.id         -> http://web-app:3100
  #   invitation.vizunicum.my.id  -> http://public-invite:3200
  #   admin.vizunicum.my.id       -> http://admin:8080          (P5-01, not before)
  #
  # The service names resolve on this compose network, so nothing is published to the
  # host for the tunnel's sake.
  #
  # ## Why it is behind a profile
  #
  # The stack has to come up and be verifiable without a tunnel -- that is how it was
  # brought up the first time, reachable over the VPN by port. `--profile tunnel` adds
  # public reachability as a deliberate second step:
  #
  #   docker compose -f deploy/docker-compose.staging.yml --env-file .env   #     --profile tunnel up -d
  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2025.8.1
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      # `:-` and not `:?`. Compose interpolates EVERY service in the file, including
      # ones behind an inactive profile, so `:?required` here made `up` fail for the
      # whole stack whenever the tunnel was not in use -- which is most of the time and
      # was exactly how this was found.
      #
      # An empty value reaches cloudflared instead, and it exits immediately saying the
      # token is not valid. A worse message in a rarer case, in exchange for the common
      # case working at all.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      api: { condition: service_healthy }

volumes:
  clamav-data:
  postgres-data:
  redis-data:
  minio-data:
