# The admin SPA's server. docs/SECURITY/02 puts this behind its own trust boundary.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Never indexed, never previewed. It is behind authentication on its own hostname;
    # a crawler would find a login form and listing that serves nobody.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # docs/SECURITY/08. Set here as well as at the edge, because a header that exists in
    # only one of the two places is a header that disappears the first time the edge is
    # reconfigured.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Hashed assets are immutable by construction -- a changed file gets a new name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routing: every other path is the app shell. `index.html` itself must
    # NOT be cached, or a deploy leaves browsers pointing at asset names that are gone.
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }
}
